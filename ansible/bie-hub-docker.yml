---
- hosts: bie-hub
  vars:
    tomcat_user: "{{ docker_default_user }}"
    nginx_user: "{{ docker_default_user }}"
    bie_hub_upstream_host: la_bie-hub
    skip_handlers: true
    bie_hub: ala-bie-hub
    nginx_paths_gatus_exclude:
      - "{{bie_hub_context_path}}/trove"
      - "{{bie_hub_context_path}}/externalSite"
  roles:
    - common
    - bie-hub
