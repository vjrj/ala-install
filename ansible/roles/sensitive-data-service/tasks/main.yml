---
- include_tasks: ../../common/tasks/setfacts.yml
  tags:
    - sensitive-data-service
    - deploy
    - properties
    - nginx_vhost

- name: "Create ala-sensitive-data-service directories"
  file:
    path: "{{item}}"
    state: directory
    owner: "{{ sensitive_data_user }}"
    group: "{{ sensitive_data_user }}"
    mode: 0755
  when: deployment_type != 'vm'
  with_items:
    - "{{ data_dir }}/ala-sensitive-data-service/config"
  tags:
    - properties
    - sensitive-data-service

- name: set nginx upstream server for nginx
  set_fact:
    upstream_host: "{{ sensitive_data_service_upstream_host | default('127.0.0.1') }}"
  tags:
    - deploy
    - nginx_vhost

# Recent versions use the namemaching index so we have to configure too
- include_vars: ../namematching-service/defaults/main.yml
  tags:
    - sensitive-data-service
    - deploy
    - apt

# Allow the use of a specified namematching-service version for the sds
- set_fact:
    ala_namematching_service_version: "{{ sds_ala_namematching_service_version }}"
  when:
    - sds_ala_namematching_service_version is defined

# This service links Lucene 8 and opens index formats 7-9 only. Handed the lucene-6 build (the
# one the pipelines' ala-name-matching library wants, so the two live side by side in the same
# inventory and get mixed up), it downloads a gigabyte, installs it, passes every check in
# download-nameindex.yml -- that one only verifies the artifact is internally consistent -- and
# then crash-loops at boot with "Unable to initialise searcher: ... IndexFormatTooOldException
# ... 6 (needs to be between 7 and 9)". Which is a 12-minute health-gate timeout and an opaque
# restart loop away from the actual mistake. Fail here instead, while the fix is still one line.
# Only artifacts that advertise their Lucene major in the file name can be checked.
- name: sds | the nameindex must be a Lucene major this service can open (7-9)
  vars:
    _sds_nameindex_url: >-
      {{ ala_sensitive_data_service_namematching_source
         | default('https://archives.ala.org.au/archives/nameindexes/20210811-3/namematching-20210811-3.tgz') }}
    _sds_nameindex_lucene: "{{ (_sds_nameindex_url | regex_search('lucene-([0-9]+)', '\\1') | default([], true) | first) | default('', true) }}"
  assert:
    that:
      - _sds_nameindex_lucene | int >= 7
      - _sds_nameindex_lucene | int <= 9
    fail_msg: >-
      ala_sensitive_data_service_namematching_source names a lucene-{{ _sds_nameindex_lucene }}
      index ({{ _sds_nameindex_url }}), but the sensitive-data-service only opens formats 7-9 and
      will crash-loop on it. Point it at the lucene-8 build of the same taxonomy; the lucene-6 one
      belongs to custom_namematching_url / nameindex_datestamp (pipelines), not here.
  when: _sds_nameindex_lucene | length > 0
  tags:
    - sensitive-data-service
    - nameindex

- name: Include VM tasks
  import_tasks: vm-tasks.yml
  when: deployment_type == 'vm'

# No run_once here: the next task templates into this directory on *every* host, so creating it
# only on the first one makes the rest fail with "Destination directory does not exist".
- name: ensure sds directories exist
  file: path={{item}} state=directory
  with_items:
    - "{{ data_dir }}/sds/config"
  tags:
    - sds
    - properties
    - sensitive-data-service

- name: create config.properties from template
  template: src="sds-config.properties" dest={{data_dir}}/sds/config/sds-config.properties
  tags:
    - sds
    - properties
    - sensitive-data-service

- name: Customize the configuration
  template:
    src: sensitive-data-service-config.yml
    dest: "{{data_dir}}/ala-sensitive-data-service/config/config.yml"
    owner: "{{ sensitive_data_user }}"
    group: "{{ sensitive_data_user }}"
  notify:
    - restart ala-sensitive-data-service
  tags:
    - properties
    - properties-file
    - sensitive-data-service

- name: add nginx vhost
  include_role:
    name: nginx_vhost
  vars:
    appname: "sensitive-data-service"
    hostname: "{{ sensitive_data_service_hostname }}"
    context_path: "{{ sensitive_data_service_context_path }}"
    nginx_paths:
      # Leading slash like every other role: nginx renders the same location block either way,
      # but consumers of nginx_paths that build a URL from it do not.
      - path: "/sensitive-species-data.xml"
        sort_label: "1_sensitive_species_data"
        is_proxy: false
        alias: "{{ data_dir }}/sds/sensitive-species-data.xml"
      - path: "/sensitivity-zones.xml"
        sort_label: "2_sensitivity_zones"
        is_proxy: false
        alias: "{{ data_dir }}/sds/sensitivity-zones.xml"
      - path: "/sensitivity-categories.xml"
        sort_label: "3_sensitivity_categories"
        is_proxy: false
        alias: "{{ data_dir }}/sds/sensitivity-categories.xml"
      - path: "{{ sensitive_data_service_context_path }}"
        sort_label: "9_default"
        is_proxy: true
        proxy_pass: "http://{{upstream_host}}:{{ sensitive_data_service_port }}/{{ sensitive_data_service_context_path }}"
  # notify:
  #   - reload nginx
  tags:
    - nginx_vhost
    - sensitive-data-service
    - deploy
  when: webserver_nginx | bool 

- name: Include docker tasks
  include_tasks: docker-tasks.yml
  when: deployment_type != 'vm'
