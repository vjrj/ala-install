---
- name: ensure target db directories exist
  file: path={{item}} state=directory
  with_items:
    - "{{ ala_sensitive_data_service_docker_dir }}"
    - "{{ data_dir }}/biocache/layers"
  run_once: true
  tags:
    - docker
    - docker-service

# The nameindex the INVENTORY points this service at
# (ala_sensitive_data_service_namematching_source), not namematching-service's one. The two are
# different artifacts on purpose: the sensitive-data-service links against an older Lucene major
# than the namematching-service (e.g. lucene-6 vs lucene-8 of the same backbone build), and
# opening the wrong one dies at boot with "Unable to initialise searcher: null". So it gets its
# own copy under .../lucene/namematching-{{ nameindex_datestamp }}, which is exactly the path
# sensitive-data-service-config.yml renders as `conservation.index`. Never install it into
# .../namematching-nm: that directory belongs to namematching-service.
- name: Download the nameindex configured for the sensitive-data-service
  import_tasks: ../../namematching-service/tasks/download-nameindex.yml
  vars:
    dest: "{{ data_dir }}/lucene/namematching-{{ nameindex_datestamp }}.tgz"
    final_dest: "{{ data_dir }}/lucene/namematching-{{ nameindex_datestamp }}/"
    url: "{{ ala_sensitive_data_service_namematching_source | default('https://archives.ala.org.au/archives/nameindexes/20210811-3/namematching-20210811-3.tgz') }}"
    sha1: "{{ ala_sensitive_data_service_namematching_sha1 | default('f9e42325db8d41ca0c8afeb6aeadf670978a13ac') }}"

- block:
    - name: Downloading SDS configs using configured URL
      get_url:
        url: "{{ sds_url }}/{{ item }}"
        dest: "{{ data_dir }}/sds/{{ item }}"
        timeout: 60
      loop:
        - sensitive-species-data.xml
        - sensitivity-zones.xml
        - sensitivity-categories.xml
      register: download_results_configured

    - debug:
        msg: "Downloaded file {{ item.dest }} with status {{ item.status_code }}"
      loop: "{{ download_results_configured.results }}"

    - name: Downloading layers.json from SDS using configured URL
      get_url:
        url: "{{ sds_url }}/ws/layers"
        dest: "{{ data_dir }}/sds/layers.json"
        timeout: 60

    - name: Downloading SDS layers using configured URL
      get_url:
        url: "{{ sds_layers_url }}"
        dest: "{{ data_dir }}/biocache/layers/sds-layers.tgz"
  rescue:
    - name: Downloading SDS configs using default URL
      get_url:
        url: "https://sds.ala.org.au/{{ item }}"
        dest: "{{ data_dir }}/sds/{{ item }}"
        timeout: 60
      loop:
        - sensitive-species-data.xml
        - sensitivity-zones.xml
        - sensitivity-categories.xml
      register: download_results_default

    - debug:
        msg: "Downloaded file {{ item.dest }} with status {{ item.status_code }}"
      loop: "{{ download_results_default.results }}"

    - name: Downloading layers.json from SDS using default URL
      get_url:
        url: "https://sds.ala.org.au/ws/layers"
        dest: "{{ data_dir }}/sds/layers.json"
        timeout: 60

    - name: Downloading SDS layers using default URL
      get_url:
        url: "https://archives.ala.org.au/archives/layers/sds-layers.tgz"
        dest: "{{ data_dir}}/biocache/layers/sds-layers.tgz"

# The rescue above only fires on an HTTP error. A local sds-webapp2 that answers the data paths
# with its own error page (200 + text/html) is downloaded verbatim, and the service then dies
# parsing HTML as XML ("Content is not allowed in prolog"). Check what actually landed.
- name: Check the SDS data files really are XML
  ansible.builtin.command: "head -c 5 {{ data_dir }}/sds/{{ item }}"
  changed_when: false
  loop:
    - sensitive-species-data.xml
    - sensitivity-zones.xml
    - sensitivity-categories.xml
  register: sds_xml_head

- name: Re-download from the ALA archive whatever did not come back as XML
  get_url:
    url: "https://sds.ala.org.au/{{ item.item }}"
    dest: "{{ data_dir }}/sds/{{ item.item }}"
    timeout: 60
    force: true
  loop: "{{ sds_xml_head.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout is not match('<\?xml')

- name: Re-check the SDS data files
  ansible.builtin.command: "head -c 5 {{ data_dir }}/sds/{{ item }}"
  changed_when: false
  loop:
    - sensitive-species-data.xml
    - sensitivity-zones.xml
    - sensitivity-categories.xml
  register: sds_xml_head_final

- name: Fail if a SDS data file is still not XML
  assert:
    that:
      - item.stdout is match('<\?xml')
    fail_msg: >-
      {{ data_dir }}/sds/{{ item.item }} is not XML (starts with {{ item.stdout | trim }}).
      Neither {{ sds_url }} nor https://sds.ala.org.au served it — the sensitive-data-service
      would crash-loop parsing it.
  loop: "{{ sds_xml_head_final.results }}"
  loop_control:
    label: "{{ item.item }}"

# ALA's file names some categories and zones by display name ("Critically Endangered", "New
# South Wales") where the service only resolves ids ("CR", "NSW"). Those instances end up with a
# null category/zone and SensitivityInstance.equals then NPEs while the taxon store verifies the
# species list, so the service never finishes booting. 732 of 6677 instances on 2026-08-05.
- name: Normalize the category and zone references of the SDS species data to ids
  ansible.builtin.script: >-
    normalize-sds-species.py
    {{ data_dir }}/sds/sensitive-species-data.xml
    {{ data_dir }}/sds/sensitivity-categories.xml
    {{ data_dir }}/sds/sensitivity-zones.xml
  register: sds_species_normalized
  changed_when: "'rewrote 0 ' not in sds_species_normalized.stdout"

# SDS def ALA tgz is created with a MacOS tar
# https://github.com/yarnpkg/yarn/issues/770
- name: Extracting SDS layers
  unarchive:
    src: "{{ data_dir }}/biocache/layers/sds-layers.tgz"
    dest: "{{ data_dir }}/biocache/layers/"
    remote_src: true
    extra_opts:
      - "--warning=no-unknown-keyword"

# The legacy standalone stack (its own docker-compose.yml + swarm stack) only applies to the
# self-contained ala-install deployment. Under la-docker-compose (deployment_type == 'container')
# the service is rendered into the main compose (services/sensitive-data-service.yml), so skip
# stack-create to avoid a stray, unused docker-compose.yml that pins the wrong image
# (atlasoflivingaustralia/…:SNAPSHOT).
- name: Deploy sensitive-data service stack
  import_tasks: ../../docker-common/tasks/stack-create.yml
  vars:
    stack: la_sensitive_data_service
    docker_compose_data_dir: "{{ ala_sensitive_data_service_docker_dir }}"
  when: deployment_type != 'container'
