---
- include_tasks: ../../common/tasks/setfacts.yml
  tags:
    - namematching-service
    - deploy
    - properties
    - nginx_vhost

- name: set nginx upstream server for nginx
  set_fact:
    upstream_host: "{{ namematching_service_upstream_host | default('127.0.0.1') }}"
  tags:
    - deploy
    - nginx_vhost

- name: Include VM tasks
  import_tasks: vm-tasks.yml
  when: deployment_type == 'vm'

- name: "Create ala-namematching-service directories"
  file:
    path: "{{item}}"
    state: directory
    owner: "{{ namematching_user }}"
    group: "{{ namematching_user }}"
    mode: 0755
  with_items:
    - "/var/log/atlas/namematching-service"
  tags:
    - properties
    - namematching-service

- name: "Create ala-namematching-service directories (only docker)"
  file:
    path: "{{item}}"
    state: directory
    owner: "{{ namematching_user }}"
    group: "{{ namematching_user }}"
    mode: 0755
  with_items:
    - "{{ data_dir }}/ala-namematching-service/config"
  when: deployment_type != 'vm'
  tags:
    - properties
    - namematching-service

- name: Customize configuration already added by apt package
  template:
    src: namematching-service-config.yml
    dest: "{{data_dir}}/ala-namematching-service/config/config.yml"
    owner: "{{ namematching_user }}"
    group: "{{ namematching_user }}"
  notify:
    - restart ala-namematching-service
  tags:
    - properties
    - properties-file
    - namematching-service

# The species group files map display groups ("Fishes", "Monocots") onto concrete taxon
# names, and SpeciesGroupsUtil resolves those names against the deployed name index. Every
# backbone spells its ranks differently, so a file is only valid for the backbone it was
# written against: the ALA-taxonomy default resolves `Osteichthyes` on a COL index to an
# unranked clade whose lft/rgt range contains Aves and Mammalia, and every bird and mammal
# comes back tagged "Fishes".
#
# So pick the variant matching the index: groups-<species_groups_variant>.json when that
# file ships with the role, else the ALA-taxonomy default. Group NAMES stay identical
# across variants on purpose — the occurrence facet exposes them as
# `species_group.<Name>` i18n codes, so renaming one silently breaks its translations.
# scripts/validate-species-groups.sh in la-docker-compose checks a file against a live
# index, including that name-set contract.
- name: Customize species group files
  copy:
    src: "{{ lookup('ansible.builtin.first_found', _sg_candidates) }}"
    dest: "{{data_dir}}/ala-namematching-service/config/{{ item }}.json"
    owner: "{{ namematching_user }}"
    group: "{{ namematching_user }}"
  vars:
    _sg_candidates:
      files:
        - "{{ item }}-{{ species_groups_variant }}.json"
        - "{{ item }}.json"
      paths:
        - "{{ role_path }}/files"
  with_items:
    - "groups"
    - "subgroups"
  notify:
    - restart ala-namematching-service
  tags:
    - properties
    - namematching-service

- name: add nginx vhost
  include_role:
    name: nginx_vhost
  vars:
    appname: "namematching-service"
    hostname: "{{ namematching_service_hostname }}"
    context_path: "{{ namematching_service_context_path }}"
    nginx_paths:
      - path: "{{ namematching_service_context_path }}"
        sort_label: "1"
        is_proxy: true
        proxy_pass: "http://{{upstream_host}}:{{ namematching_service_port }}/{{ namematching_service_context_path }}"
  # notify:
  #   - reload nginx
  tags:
    - nginx_vhost
    - namematching-service
    - deploy
  when: webserver_nginx | bool

- name: Include docker tasks
  include_tasks: docker-tasks.yml
  when: deployment_type != 'vm'
