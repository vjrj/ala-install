- include_tasks: ../../common/tasks/setfacts.yml
  tags:
    - dashboard
    - properties

- name: ensure target directories exist [data subdirectories etc.]
  file: path={{item}} state=directory owner={{dashboard_user}} group={{dashboard_user}}
  with_items:
    - "{{data_dir}}/dashboard/config"
    - "{{data_dir}}/dashboard/zip"
    - "{{data_dir}}/dashboard/csv"
  tags:
    - dashboard
    - properties

- name: copy all config.properties
  template: src=dashboard-config.properties dest={{data_dir}}/dashboard/config/dashboard-config.properties output_encoding=iso-8859-1
  tags:
    - dashboard
    - properties
    - properties-file

- name: copy logback config
  template:
    src: logback.xml
    dest: "{{data_dir}}/dashboard/config/logback.xml"
  tags:
    - dashboard
    - properties

- name: copy data.json
  # The static counts CacheService reads are maintained per portal: seed the file, never
  # overwrite it, or every redeploy puts ALA's sample figures back.
  copy: src=data.json dest={{data_dir}}/dashboard/data.json force=false
  tags:
    - dashboard
    - properties

- name: set data ownership
  file: path={{data_dir}}/dashboard owner={{dashboard_user}} group={{dashboard_user}} recurse=true
  tags:
    - dashboard
    - properties

- include_tasks: ../../apache_vhost/tasks/main.yml
  vars:
    context_path: '{{ dashboard_context_path }}'
    hostname: '{{ dashboard_hostname }}'
  tags:
    - dashboard
    - apache_vhost
    - deploy
  when: not webserver_nginx and dashboard_on_vm

- name: add nginx vhost if configured
  include_role:
    name: nginx_vhost
  vars:
    appname: "dashboard"
    hostname: "{{ dashboard_hostname }}"
    context_path: "{{ dashboard_context_path }}"
  tags:
    - nginx_vhost
    - deploy
    - dashboard
  when: webserver_nginx | bool 

- include_tasks: ../../tomcat_deploy/tasks/main.yml
  vars:
    war_url: '{{ dashboard_war_url }}'
    context_path: '{{ dashboard_context_path }}'
    hostname: '{{ dashboard_hostname }}'
  tags:
    - dashboard
    - tomcat_vhost
    - deploy
  when: dashboard_on_vm
