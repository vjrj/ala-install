- name: Install zip command
  apt: pkg="zip" state=present
  tags:
    - pwa

- name: Check if PWA artifact already exists
  ansible.builtin.stat:
    path: "/data/biocollect/{{ pwa_artifact_id }}.zip"
  register: pwa_artifact_stat
  tags:
    - pwa

 # We have to use curl instead of get_url as the latter is broken for some mysterious reason
- name: Download PWA artifact (if it doesn't exist)
  ansible.builtin.command:
    cmd: "curl -X GET https://api.github.com/repos/AtlasOfLivingAustralia/biocollect-pwa/actions/artifacts/{{ pwa_artifact_id }}/zip -H 'Authorization: Bearer {{ pwa_gh_token }}' -o /data/biocollect/{{ pwa_artifact_id }}.zip -v -L"
  when: not pwa_artifact_stat.stat.exists
  tags:
   - pwa

- name: Remove current PWA deployment
  file:
    path: /data/biocollect/mobile-app
    state: absent
  tags:
    - pwa

- name: Extract new PWA archives
  ansible.builtin.shell: "sudo unzip {{ pwa_artifact_id }}.zip"
  args:
    chdir: /data/biocollect
  tags:
    - pwa

- name: Extract new PWA build
  ansible.builtin.shell: "sudo unzip {{ pwa_artifact_name }}.zip -d /data/biocollect/mobile-app"
  args:
    chdir: /data/biocollect
  tags:
    - pwa

- name: Find all .zip files in the biocollect directory
  ansible.builtin.find:
    paths: "/data/biocollect"
    patterns: "*.zip"
  register: zip_files
  tags:
    - pwa

- name: Remove all .zip files excluding the current PWA artifact
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ zip_files.files }}"
  when: (item.path | basename) != (pwa_artifact_id ~ '.zip')
  tags:
    - pwa
