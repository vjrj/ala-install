- include_tasks: ../../common/tasks/setfacts.yml

- name: ensure target directories exist [data subdirectories etc.]
  file: path={{item}} state=directory owner={{tomcat_user}} group={{tomcat_user}}
  with_items:
    - "{{data_dir}}/spatial-hub/config/"
    - "{{data_dir}}/spatial-hub/i18n/"
    - "{{data_dir}}/ala/runtime/files/"
  tags:
    - spatial-hub
    - spatial-hub-config
    - properties

# A portal can ship its own copy of any of these files (e.g. a translated menu) from its
# inventory, as menu_config_json does in the regions role:
#   spatial_hub_menu_config_json = {{ inventory_dir }}/files/spatial-hub/menu-config.json
# Otherwise every deploy overwrites them with the role template.
- name: copy all config.yml
  template:
    src: "{{ item.src if item.src else (spatial_hub_portal | lower ~ '/' ~ item.file) }}"
    dest: "{{data_dir}}/spatial-hub/config/{{item.file}}"
    owner: "{{tomcat_user}}"
    group: "{{tomcat_user}}"
  with_items:
    - { file: "spatial-hub-config.yml", src: "{{ spatial_hub_config_yml | default('') }}" }
    - { file: "menu-config.json", src: "{{ spatial_hub_menu_config_json | default('') }}" }
    - { file: "view-config.json", src: "{{ spatial_hub_view_config_json | default('') }}" }
  loop_control:
    label: "{{ item.file }}"
  tags:
    - config
    - spatial-hub
    - spatial-hub-config
    - properties
    - properties-file

- name: copy system message
  template: src=system-message.json dest={{data_dir}}/spatial-hub/config/system-message.json owner={{tomcat_user}} group={{tomcat_user}}
  tags:
    - spatial-hub
    - spatial-hub-config
    - properties

- include_tasks: ../../apache_vhost/tasks/main.yml
  vars:
    context_path: '{{ spatial_hub_context_path }}'
    hostname: '{{ spatial_hub_hostname }}'
  tags:
    - deploy
    - apache_vhost
    - spatial-hub
  when: not webserver_nginx and deployment_type == 'vm'

- name: add nginx vhost if configured
  include_role:
    name: nginx_vhost
  vars:
    appname: "spatial-hub"
    hostname: "{{ spatial_hub_hostname }}"
    context_path: "{{ spatial_hub_context_path }}"
  tags:
    - nginx_vhost
    - deploy
    - spatial-hub
  when: webserver_nginx | bool 

- name: Add proxy paths for grandfathered routes
  include_role:
    name: nginx_vhost
  vars:
    appname: "spatial-hub"
    hostname: "{{ spatial_hub_hostname }}"
    context_path: "{{ spatial_hub_context_path }}"
    nginx_paths:
      # sort_label required by the optimized nginx_vhost.j2 template (fast mode);
      # it does `sort(attribute='sort_label')` with no default. See spatial-service.
      - path: "{{ spatial_hub_context_path }}webportal"
        sort_label: "1"
        is_proxy: false
        rewrite: "{{ spatial_hub_context_path }}"
  tags:
    - nginx_vhost
    - deploy
    - spatial-hub
  when: webserver_nginx | bool

# A custom layout (skin.layout + /data/spatial-hub/views/layouts) may load its own files with
# <asset:stylesheet src="css/x.css"/>. The hub copies /data/spatial-hub/assets into its
# exploded war, which a hub running as a jar (3.x, docker) does not have, so those files 404.
# List them here and nginx serves each one from the assets dir:
#   spatial_hub_extra_assets = ["css/gbif-es-spatial-extra.css", "js/gbif-es-spatial-extra.js"]
- name: Serve the portal's own hub assets from nginx
  include_role:
    name: nginx_vhost
  vars:
    appname: "spatial-hub"
    hostname: "{{ spatial_hub_hostname }}"
    context_path: "{{ spatial_hub_context_path }}"
    nginx_paths: >-
      {%- set out = [] -%}
      {%- for f in spatial_hub_extra_assets -%}
        {%- set _ = out.append({'path': spatial_hub_context_path ~ 'assets/' ~ f,
                                'sort_label': '2-' ~ (f | regex_replace('[^A-Za-z0-9]', '-')),
                                'is_proxy': false,
                                'alias': (spatial_hub_extra_assets_dir | default(data_dir ~ '/spatial-hub/assets')) ~ '/' ~ f}) -%}
      {%- endfor -%}
      {{ out }}
  tags:
    - nginx_vhost
    - deploy
    - spatial-hub
  when: webserver_nginx | bool and spatial_hub_extra_assets | default([]) | length > 0

- include_tasks: ../../tomcat_deploy/tasks/main.yml
  vars:
    war_url: '{{ spatial_hub_war_url }}'
    context_path: '{{ spatial_hub_context_path }}'
    hostname: '{{ spatial_hub_hostname }}'
  tags:
    - deploy
    - tomcat_vhost
    - spatial-hub
    - spatial-hub-deploy
  # Deploy the WAR to a local tomcat only on VMs; container images bake the app.
  when: deployment_type == 'vm' or deployment_type is undefined

- name: set data ownership
  file: path={{data_dir}}/ala/data/ owner={{tomcat_user}} group={{tomcat_user}} recurse=true
  notify: 
    - restart tomcat
  tags:
    - spatial-hub
    - spatial-hub-config
    - properties
