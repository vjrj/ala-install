---
# Build Docker images from source
# This task file is included when build_images is true

- name: Ensure docker directory exists
  file:
    path: "{{ playbook_dir }}/../docker"
    state: directory
    mode: '0755'

- name: Check if docker buildx is available
  command: docker buildx version
  register: buildx_check
  failed_when: false
  changed_when: false

- name: Fail if buildx is not available
  fail:
    msg: "Docker buildx is not available. Please install Docker Desktop or enable buildx."
  when: buildx_check.rc != 0

- name: Display build information
  debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "Building images with docker buildx bake"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "  Configuration:"
      - "    - Docker Bake File: {{ docker_compose_data_dir }}/docker-bake.hcl"
      - "    - Registry: {{ docker_registry | default('(local)') }}"
      - "    - Tags: Using service-specific versions from inventory"
      - "      • CAS: {{ cas_version }}"
      - "      • Collectory: {{ collectory_version }}"
      - "      • Species List: {{ species_list_version }}"
      - "      • UserDetails: {{ user_details_version }}"
      - "      • APIKey: {{ apikey_version }}"
      - "      • CAS Management: {{ cas_management_version }}"
      - "    - Services: {{ services_enabled | join(', ') }}{% if i18n.enabled %} + ala-i18n{% endif %}"
      - ""
      - "  ⏱️  Estimated time:"
      - "    - First build: 15-30 minutes (downloads base images ~500MB)"
      - "    - Subsequent builds: 2-5 minutes (uses cache)"
      - ""
      - "  💡 Tip: Watch progress with 'docker images' in another terminal"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

- name: Check if gradle-builder images already exist
  shell: docker image inspect gradle-builder:jdk17 > /dev/null 2>&1 && docker image inspect gradle-builder:jdk11 > /dev/null 2>&1
  register: builders_exist
  failed_when: false
  changed_when: false

- name: Display builder cache status
  debug:
    msg: "{{ '✅ Gradle builders already exist, skipping rebuild' if builders_exist.rc == 0 else '🔨 Building gradle-builder images (first time only)' }}"

- name: Build builder images first (gradle-builder)
  shell: >
    set -e;
    docker context use desktop-linux 2>/dev/null || docker context use default;
    docker buildx bake
    -f docker-bake.hcl
    --set *.cache-from=type=local,src={{ docker_build_cache_dir }}
    --set *.cache-to=type=local,dest={{ docker_build_cache_dir }},mode=max
    --allow=fs={{ ansible_env.HOME }}/.cache
    --allow=fs.read=dockerfiles
    --progress=plain
    --load
    builders
    2>&1 | tee /tmp/docker-build-builders.log
  args:
    chdir: "{{ docker_compose_data_dir }}"
    executable: /bin/bash
  register: build_builders
  changed_when: true
  when:
    - services_to_build | length > 0
    - builders_exist.rc != 0
    - (inventory_hostname == (groups['docker_compose'] | first) or (docker_registry | default('') == ''))
  async: 1800
  poll: 0

- name: Wait for builder build to start (check log file)
  wait_for:
    path: /tmp/docker-build-builders.log
    timeout: 30
  when: services_enabled | length > 0 and builders_exist.rc != 0

- name: Monitor builder build progress
  shell: |
    while kill -0 {{ build_builders.ansible_job_id }} 2>/dev/null; do
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "🔨 Building gradle-builder images..."
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      tail -15 /tmp/docker-build-builders.log | grep -E '#[0-9]+|DONE|CACHED|downloading|extracting|exporting' || tail -5 /tmp/docker-build-builders.log
      echo ""
      echo "💡 Full log: tail -f /tmp/docker-build-builders.log"
      echo ""
      sleep 15
    done
  args:
    executable: /bin/bash
  when: services_enabled | length > 0 and builders_exist.rc != 0
  register: monitor_builders
  async: 1800
  poll: 0

- name: Wait for builder images to finish
  async_status:
    jid: "{{ build_builders.ansible_job_id }}"
  register: build_result
  until: build_result.finished
  retries: 180
  delay: 10
  when: services_enabled | length > 0 and builders_exist.rc != 0

- name: Check if builder build failed
  fail:
    msg: |
      ❌ Builder images build FAILED!
      
      Exit code: {{ build_result.rc }}
      
      Check the build log for details:
        tail -100 /tmp/docker-build-builders.log
      
      The gradle/maven builder images are required for building services.
      Fix the issues and re-run the playbook.
  when:
    - services_enabled | length > 0
    - builders_exist.rc != 0
    - build_result.rc is defined
    - build_result.rc != 0

- name: Display builder build success
  debug:
    msg: "✅ Builder images (gradle/maven) built successfully!"
  when:
    - services_enabled | length > 0
    - builders_exist.rc != 0
    - build_result.rc is defined
    - build_result.rc == 0

- name: Stop monitoring
  async_status:
    jid: "{{ monitor_builders.ansible_job_id }}"
    mode: cleanup
  when: 
    - services_enabled | length > 0
    - monitor_builders.ansible_job_id is defined
  ignore_errors: true

- name: Build service images
  shell: >
    set -e;
    docker context use desktop-linux 2>/dev/null || docker context use default;
    docker buildx bake
    -f docker-bake.hcl
    --set *.cache-from=type=local,src={{ docker_build_cache_dir }}
    --set *.cache-to=type=local,dest={{ docker_build_cache_dir }},mode=max
    --allow=fs={{ ansible_env.HOME }}/.cache
    --allow=fs.read=dockerfiles
    --progress=plain
    {{ '--push' if (docker_registry | default('') != '') else '--load' }}
    {{ 'all' if (inventory_hostname == (groups['docker_compose'] | first)) else 'services' }}
    2>&1 | tee /tmp/docker-build-services.log
  args:
    chdir: "{{ docker_compose_data_dir }}"
    executable: /bin/bash
  register: build_services
  changed_when: true
  when:
    - services_to_build | length > 0
    - (inventory_hostname == (groups['docker_compose'] | first) or (docker_registry | default('') == ''))
  async: 3600
  poll: 0

- name: Wait for service build to start
  wait_for:
    path: /tmp/docker-build-services.log
    timeout: 30
  when: services_enabled | length > 0

- name: Monitor service build progress
  shell: |
    while kill -0 {{ build_services.ansible_job_id }} 2>/dev/null; do
      clear
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "🚀 Building service images: {{ services_enabled | join(', ') }}"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""
      tail -20 /tmp/docker-build-services.log | grep -E '#[0-9]+|DONE|CACHED|downloading|extracting|exporting|Downloading|Compiling|Task :' || tail -10 /tmp/docker-build-services.log
      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "💡 Full log: tail -f /tmp/docker-build-services.log"
      echo "🕐 $(date '+%H:%M:%S')"
      echo ""
      sleep 15
    done
  args:
    executable: /bin/bash
  async: 3600
  poll: 0
  when: services_enabled | length > 0
  register: monitor_services

- name: Wait for service images to finish
  async_status:
    jid: "{{ build_services.ansible_job_id }}"
  register: services_result
  until: services_result.finished
  retries: 360
  delay: 10
  when: 
    - services_enabled | length > 0
    - build_services.ansible_job_id is defined

- name: Check if service build failed
  fail:
    msg: |
      ❌ Service build FAILED!
      
      Exit code: {{ services_result.rc }}
      
      Check the build log for details:
        tail -100 /tmp/docker-build-services.log
      
      Common issues:
        - Dockerfile syntax errors
        - Missing dependencies
        - Network issues downloading packages
        - Out of disk space
  when:
    - services_enabled | length > 0
    - services_result.rc is defined
    - services_result.rc != 0

# Message removed - was confusing as it appeared before secondary node pulls
# Build completion is logged by docker buildx bake output

- name: Pull Docker images on secondary nodes
  command: docker compose pull
  args:
    chdir: "{{ docker_compose_data_dir }}"
  become: true
  when:
    - build_images | default(false)
    - docker_registry | default('') != ''
    - inventory_hostname != (groups['docker_compose'] | first)
  tags:
    - build
    - docker-compose

- name: Stop service monitoring
  async_status:
    jid: "{{ monitor_services.ansible_job_id }}"
    mode: cleanup
  when:
    - services_enabled | length > 0
    - monitor_services is defined
    - monitor_services.ansible_job_id is defined
  ignore_errors: true

