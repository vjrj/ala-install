---
# Docker Compose Role - Main Tasks
# Orchestrates docker-compose generation and deployment for Living Atlas

- name: Capture original user details for file ownership
  set_fact:
    docker_compose_userid: "{{ ansible_user_id }}"
    docker_compose_usergid: "{{ ansible_user_gid }}"
  tags:
    - always
    - only
    - docker-compose
  become: false

- name: Load variables from collectory group
  include_vars:
    file: "{{ playbook_dir }}/roles/collectory/vars/main.yml"
  when: "'collectory' in group_names"
  tags:
    - always
    - only

- name: Load variables from cas group
  include_vars:
    file: "{{ playbook_dir }}/roles/cas5/vars/main.yml"
  when: "'cas-servers' in group_names"
  tags:
    - always
    - only

- name: Calculate collectory_app based on version
  set_fact:
    collectory_app: "{{ 'collectory' if collectory_version is version('3', '>=') else 'ala-collectory' }}"
  when: "'collectory' in group_names and collectory_version is defined"
  tags:
    - always
    - only

- name: Generate and Deploy Docker Compose
  when: "inventory_hostname in groups['docker_compose']"
  block:
    - name: Create dockerfiles subdirectory in output
      file:
        path: "{{ docker_compose_data_dir }}/dockerfiles"
        state: directory
        mode: '0755'
        owner: "{{ docker_compose_userid }}"
        group: "{{ docker_compose_usergid }}"
      become: true
      tags:
        - always
        - only
        - docker-compose
        - build

    - name: Copy static docker files to output (builders)
      copy:
        src: "docker/"
        dest: "{{ docker_compose_data_dir }}/dockerfiles/"
        mode: preserve
        owner: "{{ docker_compose_userid }}"
        group: "{{ docker_compose_usergid }}"
      become: true
      tags:
        - always
        - only
        - docker-compose
        - build

    - name: Include generate-compose tasks
      include_tasks: generate-compose.yml
      tags:
        - always
        - only
        - docker-compose

    - name: Include database initialization tasks
      include_tasks: generate-db-init-scripts.yml
      when:
        - deployment_type == 'container'
        - db_init_enabled | default(true) | bool
        - "'cas-servers' in group_names"
      tags:
        - db-init
        - cas-dbs

    # Build images - first build builders, then services
    - name: "DEBUG: Show services_to_build before bake"
      debug:
        msg: "services_to_build = {{ services_to_build | default('UNDEFINED') }}"
      tags:
        - always
        - docker-compose
        - build

    # Build builder images first (gradle-builder, maven-builder)
    - name: Build builder base images (gradle/maven)
      command: docker buildx bake -f {{ docker_compose_data_dir }}/docker-bake.hcl --load builders
      args:
        chdir: "{{ docker_compose_data_dir }}"
      environment:
        BUILDX_BAKE_ENTITLEMENTS_FS: "0"
      become: true
      run_once: true
      delegate_to: "{{ groups['docker_compose'] | first }}"
      when:
        - build_images | default(false) | bool
        - services_to_build | length > 0
      tags:
        - docker-compose
        - build
      register: build_builders_result
      failed_when: false

    - name: Check if builder build succeeded
      fail:
        msg: "Failed to build builder images. Check docker buildx logs."
      when:
        - build_images | default(false) | bool
        - build_builders_result is defined
        - build_builders_result.rc is defined
        - build_builders_result.rc != 0

    # Build and push service images to registry (first node only)
    - name: Build and push Docker images to registry (first node only)
      command: docker buildx bake -f {{ docker_compose_data_dir }}/docker-bake.hcl --push services
      args:
        chdir: "{{ docker_compose_data_dir }}"
      environment:
        BUILDX_BAKE_ENTITLEMENTS_FS: "0"
      become: true
      run_once: true
      delegate_to: "{{ groups['docker_compose'] | first }}"
      when:
        - build_images | default(false) | bool
        - docker_registry is defined and docker_registry != ''
      tags:
        - docker-compose
        - build
      register: build_and_push_result

    # Verify images are available in registry before other nodes pull
    - name: Verify pushed images are available in registry
      shell: |
        set -e
        IMAGES=$(docker compose config --images 2>/dev/null | grep -v '^$' || true)
        if [ -z "$IMAGES" ]; then
          echo "No images to verify"
          exit 0
        fi
        
        echo "Verifying images in registry..."
        for img in $IMAGES; do
          # Skip images without registry prefix or local-only images
          if [[ ! "$img" =~ ^{{ docker_registry | regex_escape }}/ ]]; then
            echo "Skipping local image: $img"
            continue
          fi
          
          echo "Checking: $img"
          retries=30
          while [ $retries -gt 0 ]; do
            if docker manifest inspect "$img" >/dev/null 2>&1; then
              echo "✓ Available: $img"
              break
            fi
            retries=$((retries - 1))
            if [ $retries -eq 0 ]; then
              echo "✗ Timeout waiting for: $img"
              exit 1
            fi
            echo "  Waiting for image to be available in registry... ($retries retries left)"
            sleep 2
          done
        done
        echo "All images verified in registry"
      args:
        chdir: "{{ docker_compose_data_dir }}"
      become: true
      run_once: true
      delegate_to: "{{ groups['docker_compose'] | first }}"
      when:
        - build_images | default(false) | bool
        - docker_registry is defined and docker_registry != ''
        - build_and_push_result is changed
      tags:
        - docker-compose
        - build

    # Build images locally when no registry configured
    - name: Build Docker images locally (no registry)
      command: docker buildx bake -f {{ docker_compose_data_dir }}/docker-bake.hcl --load services
      args:
        chdir: "{{ docker_compose_data_dir }}"
      environment:
        BUILDX_BAKE_ENTITLEMENTS_FS: "0"
      become: true
      when:
        - build_images | default(false) | bool
        - docker_registry is not defined or docker_registry == ''
      tags:
        - docker-compose
        - build

    # Pull images from registry on other nodes (after verification)
    - name: Pull Docker images from registry (other nodes)
      command: docker compose pull
      args:
        chdir: "{{ docker_compose_data_dir }}"
      become: true
      when:
        - build_images | default(false) | bool
        - docker_registry is defined and docker_registry != ''
        - inventory_hostname != groups['docker_compose'] | first
      tags:
        - docker-compose
        - build



    - name: Start Docker Compose services
      command: docker compose up -d
      args:
        chdir: "{{ docker_compose_data_dir }}"
      become: true
      when:
        - auto_deploy | default(true) | bool
      tags:
        - docker-compose
        - deploy
