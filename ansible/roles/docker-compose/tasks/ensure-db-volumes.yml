---
# Ensure external named volumes exist for databases with la_ prefix
# This prevents accidental deletion of database data

- name: "Database volumes: Set Docker socket path"
  set_fact:
    docker_socket: "{{ lookup('env', 'DOCKER_HOST') | default('unix:///var/run/docker.sock') }}"
  tags:
    - db-init
    - docker-volumes

- name: "Database volumes: Create MySQL external volume"
  docker_volume:
    name: la_mysql-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when:
    - "'cas-servers' in group_names or 'collectory' in group_names or 'species-list' in group_names or 'logger-service' in group_names or 'alerts-service' in group_names"

- name: "Database volumes: Create PostgreSQL external volume"
  docker_volume:
    name: la_postgres-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when:
    - "'spatial' in group_names or 'image-service' in group_names or 'doi-service' in group_names or 'data_quality_filter_service' in group_names"

- name: "Database volumes: Create MongoDB external volume"
  docker_volume:
    name: la_mongodb-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when:
    - "'cas-servers' in group_names or 'ecodata' in group_names"
    
- name: "Database volumes: Create Gatus external volume"
  docker_volume:
    name: la_gatus-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when:
    - "'gatus' in group_names"

- name: "Database volumes: Create Solr external volume"
  docker_volume:
    name: la_solr-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when:
    - "'solrcloud' in group_names or 'solr' in group_names"

- name: "Database volumes: Create Cassandra external volume"
  docker_volume:
    name: la_cassandra-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when:
    - "'cassandra5' in group_names"

- name: "Database volumes: Create Elasticsearch external volume"
  docker_volume:
    name: la_elasticsearch-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  become: true
  tags:
    - db-init
    - docker-volumes
  when:
    - "'image-service' in group_names or 'events' in group_names or 'doi-service' in group_names or 'ecodata' in group_names"

- name: "Database volumes: Create SSL certificates external volume"
  docker_volume:
    name: la-site-certs
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  when: use_la_site_certs | default(false)
  tags:
    - db-init
    - docker-volumes
