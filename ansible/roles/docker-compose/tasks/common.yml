---

- name: ensure gatus configuration directory exists on gatus host
  file:
    path: "{{ hostvars[groups['gatus'][0]]['gatus_config_dir'] | default(gatus_config_dir) }}"
    state: directory
    owner: "{{ hostvars[groups['gatus'][0]]['docker_compose_userid'] | default(docker_compose_userid) }}"
    group: "{{ hostvars[groups['gatus'][0]]['docker_compose_usergid'] | default(docker_compose_usergid) }}"
  when: 
    - use_gatus | default(true) | bool
    - groups['gatus'] is defined and groups['gatus'] | length > 0
  delegate_to: "{{ groups['gatus'][0] }}"
  run_once: true
  tags:
    - docker-compose
    - gatus

- name: ensure nginx directories exist for docker vhost generation
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_compose_userid }}"
    group: "{{ docker_compose_usergid }}"
  with_items:
    - "{{ nginx_conf_dir }}/conf.d"
    - "{{ nginx_conf_dir }}/sites-enabled"
    - "{{ nginx_conf_dir }}/sites-available"
  tags:
    - docker-compose
