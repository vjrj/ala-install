# Container-mode safe: skip_handlers=true (set by la-compose) suppresses the tomcat restart,
# since there is no tomcat service in the container (the image bakes/runs the app). On VMs
# skip_handlers is unset/false so the restart fires as before. Overrides common's ungated handler.
- name: restart tomcat
  service: name={{tomcat}} state=restarted enabled="yes"
  when:
  - skip_handlers | default("false") | bool == false
