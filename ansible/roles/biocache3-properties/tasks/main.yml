- include_tasks: ../../common/tasks/setfacts.yml
  tags:
    - properties
    - biocache-properties
    - biocache-layers
    - biocache-config-properties

- name: ensure target directories exist
  file: path={{item}} state=directory
  with_items:
    - "{{data_dir}}/biocache/config"
  tags:
    - properties
    - biocache-properties

- include_tasks: ../solrcloud/tasks/docker-facts.yml
  tags:
    - docker
    - docker-service
  when: (deployment_type | default('vm')) != 'vm'

- name: copy biocache config properties template 
  template: src={{item}} dest={{data_dir}}/biocache/config/{{item}} mode=0644 output_encoding=iso-8859-1
  with_items:
    - biocache-config.properties
  tags:
    - properties
    - properties-file
    - biocache-properties
    - biocache-config-properties

# groups.json (/explore/groups) and subgroups.json (/explore/hierarchy) must use the names
# namematching writes to species_group and species_subgroup (namematching_groups_file and
# namematching_subgroups_file in namematching-service), or those groups count 0 records.
- name: copy biocache groups config
  copy: src="{{ biocache_groups_file | default('groups.json') }}" dest={{data_dir}}/biocache/config/groups.json
  tags:
    - properties
    - biocache-properties

- name: copy biocache subgroups config
  copy: src="{{ biocache_subgroups_file | default('subgroups.json') }}" dest={{data_dir}}/biocache/config/subgroups.json
  tags:
    - properties
    - biocache-properties

- name: ensure target directories exist [data subdirectories etc.
  file: path={{ item }} state=directory mode=0775
  with_items:
    - "{{data_dir}}/cache"
    - "{{data_dir}}/biocache/tmp"
    - "{{data_dir}}/biocache/heatmap"
    - "{{data_dir}}/offline/exports"    
  tags:
    - properties
    - biocache-properties
