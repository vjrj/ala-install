- include_tasks: ../../common/tasks/setfacts.yml
  tags:
    - branding

- name: Ensure data directory exists
  file: path=/srv/{{ branding_url }}/www/{{ item }} state=directory owner={{ansible_user}} group={{ansible_user}}
  with_items:
    - "{{ branding_path }}"
  tags:
    - branding

- name: add nginx vhost if configured
  include_role:
    name: nginx_vhost
  vars:
    appname: "branding"
    hostname: "{{ branding_url }}"
    context_path: "/"
    nginx_cors_origin_regexp: "{{ branding_nginx_cors_origin_regexp if branding_nginx_cors_origin_regexp is defined }}"
    # Serve the same docroot at both / and the versioned path (e.g. /brand-2023/)
    # so apps that request header_and_footer_baseurl = host/brand-2023 get the
    # real assets instead of a 404 HTML page (which Chrome blocks via ORB).
    nginx_paths: "{{ [{'path': '/', 'sort_label': '1', 'is_proxy': false, 'alias': '/srv/' + branding_url + '/www/'}] + ([{'path': branding_path | regex_replace('/$', '') + '/', 'sort_label': '2', 'is_proxy': false, 'alias': '/srv/' + branding_url + '/www/'}] if (branding_path is defined and branding_path != '/') else []) }}"
  tags:
    - nginx_vhost
    - deploy
    - branding
  when: webserver_nginx | bool

- name: add nginx vhost for branding as site home (root domain)
  include_role:
    name: nginx_vhost
  vars:
    appname: "branding-home"
    hostname: "{{ branding_home_url }}"
    context_path: "/"
    nginx_cors_origin_regexp: "{{ branding_nginx_cors_origin_regexp if branding_nginx_cors_origin_regexp is defined }}"
    nginx_paths: "{{ [{'path': '/', 'sort_label': '1', 'is_proxy': false, 'alias': '/srv/' + branding_url + '/www/'}] + ([{'path': branding_path | regex_replace('/$', '') + '/', 'sort_label': '2', 'is_proxy': false, 'alias': '/srv/' + branding_url + '/www/'}] if (branding_path is defined and branding_path != '/') else []) }}"
  tags:
    - nginx_vhost
    - deploy
    - branding
  when:
    - webserver_nginx | bool
    - branding_as_home | default(true) | bool
    - branding_home_url is defined
