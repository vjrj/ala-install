- include_tasks: ../../common/tasks/setfacts.yml
  tags:
    - branding

- name: Ensure data directory exists (VM deployment)
  file:
    path: /srv/{{ branding_url }}/www/{{ item }}
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  with_items:
    - "{{ branding_path }}"
  when: deployment_type is not defined or deployment_type == 'vm'
  tags:
    - branding

- name: Add nginx vhost for branding
  include_role:
    name: nginx_vhost
  vars:
    appname: "branding"
    hostname: "{{ branding_hostname | default(branding_url) }}"
    context_path: "/"
    nginx_cors_origin_regexp: "{{ branding_nginx_cors_origin_regexp if branding_nginx_cors_origin_regexp is defined }}"
    nginx_paths:
      - path: "/"
        sort_label: "1"
        is_proxy: "{{ true if (deployment_type is defined and deployment_type in ['swarm', 'container']) else false }}"
        proxy_pass: "{{ 'http://branding:80' if (deployment_type is defined and deployment_type in ['swarm', 'container']) else omit }}"
        alias: "{{ '/srv/' + (branding_hostname | default(branding_url)) + '/www/' if (deployment_type is not defined or deployment_type == 'vm') else omit }}"
  tags:
    - nginx_vhost
    - deploy
    - branding
  when: webserver_nginx | bool


