---
- name: ensure target db directories exist
  file:
    path: "{{item}}"
    state: directory
    owner: "{{userdetails_user}}"
    group: "{{userdetails_user}}"
  with_items:
    - "{{ userdetails_docker_db_mysql_data_dir }}"
    - "{{ userdetails_docker_db_mongo_data_dir }}"
    - "{{ userdetails_data_dir }}/docker/"
  tags:
    - docker
    - docker-service

- name: Deploy auth stack
  include_tasks: ../../docker-common/tasks/stack-create.yml
  when: deployment_type == 'swarm'
  vars:
    stack: la_auth
    docker_compose_data_dir: "{{ userdetails_data_dir }}/docker/"

- name: Remove previous socat container for MySQL tunnel
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_mysql
  tags:
    - cas-dbs

- name: Remove previous socat container for MongoDB tunnel
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_mongo
  tags:
    - cas-dbs

- name: Remove previous socat container for CAS tunnel
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_cas
  tags:
    - cas-dbs

- name: Remove previous socat container for CAS management tunnel
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_cas-management
  tags:
    - cas-dbs

- name: Create socat tunnel for MySQL
  include_tasks: ../../docker-common/tasks/socat.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_mysql
    port: 3306
  tags:
    - cas-dbs

- name: Create socat tunnel for MongoDB
  include_tasks: ../../docker-common/tasks/socat.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_mongo
    port: 27017
  tags:
    - cas-dbs

- name: Add mongo/mysql dbs and users
  include_tasks: ../../cas5-dbs/tasks/main.yml
  tags:
    - cas-dbs
  run_once: true
  when: deployment_type == 'swarm'
  vars:
    cas_db_hostname: 127.0.0.1
    user_store_db_hostname: 127.0.0.1
    apikey_db_hostname: 127.0.0.1
    ticket_registry_db_hostname: 127.0.0.1
    cas_audit_host: 127.0.0.1
    cas_spring_session_host: 127.0.0.1
    cas_tickets_host: 127.0.0.1
    cas_services_host: 127.0.0.1
    cas_mysql_src_host: '%'
    apikey_mysql_src_host: '%'

- name: Remove socat tunnel for CAS (cleanup)
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_cas
  tags:
    - cas-dbs

- name: Create socat tunnel for CAS
  include_tasks: ../../docker-common/tasks/socat.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_cas
    port: "{{ cas_port | default('9000') }}"
  tags:
    - cas-dbs

- name: Run CAS admin account tasks
  include_tasks: ../../cas5/tasks/admin-account.yml
  when: deployment_type == 'swarm'
  vars:
    cas_db_hostname: 127.0.0.1
  run_once: true
  tags:
    - cas-dbs

- name: Remove socat tunnel for CAS management (cleanup)
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_cas-management
  tags:
    - cas-dbs

- name: Create socat tunnel for CAS management
  include_tasks: ../../docker-common/tasks/socat.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_cas-management
    port: "{{ cas_management_port | default('8070') }}"
  tags:
    - cas-dbs

- name: Run CAS management OIDC tasks
  include_tasks: ../../cas-management/tasks/oidc-tasks.yml
  when: deployment_type == 'swarm'
  run_once: true
  tags:
    - cas-dbs
    - cas-oidc

- name: Remove socat tunnel for MySQL (final cleanup)
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_mysql
  tags:
    - cas-dbs

- name: Remove socat tunnel for MongoDB (final cleanup)
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_mongo
  tags:
    - cas-dbs

- name: Remove socat tunnel for CAS (final cleanup)
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_cas
  tags:
    - cas-dbs

- name: Remove socat tunnel for CAS management (final cleanup)
  include_tasks: ../../docker-common/tasks/socat-rm.yml
  when: deployment_type == 'swarm'
  vars:
    name: la_auth_cas-management
  tags:
    - cas-dbs
