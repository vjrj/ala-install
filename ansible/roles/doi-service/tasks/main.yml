- include_tasks: ../../common/tasks/setfacts.yml
  tags:
    - doi-service
    - deploy
    - properties
    - nginx_vhost

#
# JAR file deployment
#
#- include_tasks: ../../exec_jar/tasks/main.yml
  vars:
    jar_url: '{{ doi_service_jar_url }}'
    service_name: 'doi-service'
- name: add jar and service
  include_role:
    name: exec-jar
  vars:
    service_name: "doi-service"
    jar_url: '{{ doi_service_jar_url }}'
    log_config_filename: logback.xml
  tags:
    - deploy
    - service
    - doi-service
    - service-conf
  # Container mode bakes the artifact into the image; exec-jar is a VM/systemd deploy role
  # (host user + systemd unit + maven download, which needs the host's lxml). Only run it on
  # VMs — matches image-service. (CI #221: this ran in container mode and died on a broken
  # host lxml during the maven download on 2023-2.)
  when: deployment_type == 'vm' or deployment_type is undefined

#
# External configuration properties file
#
- name: ensure target directories exist data subdirectories etc.
  file:
    path: "{{item}}"
    state: directory
    owner: "{{ doi_user | default('doi-service') }}"
    group: "{{ doi_user | default('doi-service') }}"
  with_items:
    - "{{data_dir}}/doi-service"
    - "{{data_dir}}/doi-service/config"
    - "{{data_dir}}/doi-service/logs"
  tags:
    - properties
    - doi-service

- name: set data ownership
  file:
    path: "{{data_dir}}/doi-service"
    owner: "{{ doi_user | default('doi-service') }}"
    group: "{{ doi_user | default('doi-service') }}"
    recurse: true
  tags:
    - properties
    - doi-service

- name: copy all config.properties
  template:
    src: doi-service-config.yml
    dest: "{{data_dir}}/doi-service/config/doi-service-config.yml"
    owner: "{{ doi_user | default('doi-service') }}"
    group: "{{ doi_user | default('doi-service') }}"
  notify:
    - restart doi-service
  tags:
    - properties
    - properties-file
    - doi-service

- name: copy logback config
  template:
    src: logback.xml
    dest: "{{data_dir}}/doi-service/config/logback.xml"
    owner: "{{ doi_user | default('doi-service') }}"
    group: "{{ doi_user | default('doi-service') }}"
  notify:
    - restart doi-service
  tags:
    - properties
    - doi-service

- name: copy logback config
  template:
    src: logback.groovy
    dest: "{{data_dir}}/doi-service/config/logback.groovy"
    owner: "{{ doi_user | default('doi-service') }}"
    group: "{{ doi_user | default('doi-service') }}"
  notify:
    - restart doi-service
  tags:
    - properties
    - doi-service

- name: Restart doi service
  service:
    name: doi-service
    state: restarted
    enabled: yes
  # container mode runs the jar as the compose service, not a host systemd unit
  when: deployment_type == 'vm' or deployment_type is undefined
  tags:
    - doi-service

- name: add nginx vhost
  include_role:
    name: nginx_vhost
  vars:
    appname: "doi-service"
    hostname: "{{ doi_service_hostname }}"
    context_path: "{{ doi_service_context_path }}"
    # docker-local: nginx must proxy to the app container, not 127.0.0.1 (which is nginx
    # itself). Defaults to 127.0.0.1 so VM/bare-metal deploys are untouched.
    nginx_upstream_host: "{{ doi_service_upstream_host | default('127.0.0.1') }}"
    nginx_paths:
      - path: "{{ doi_service_context_path }}"
        is_proxy: true
        proxy_pass: "http://{{ doi_service_upstream_host | default('127.0.0.1') }}:{{ doi_service_port }}/{{ doi_service_context_path }}"
  # notify:
  #   - reload nginx
  tags:
    - nginx_vhost
    - doi-service
    - deploy
  when: webserver_nginx | bool 
