---
# Ensure external named volumes exist for databases with la_ prefix
# This prevents accidental deletion of database data

- name: "Database volumes: Set Docker socket path"
  set_fact:
    docker_socket: "{{ lookup('env', 'DOCKER_HOST') | default('unix:///var/run/docker.sock') }}"
  tags:
    - db-init
    - docker-volumes

- name: "Database volumes: Create MySQL external volume"
  docker_volume:
    name: la_mysql-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  tags:
    - db-init
    - docker-volumes
  run_once: true
  when:
    - "'cas-servers' in group_names"
    - "'collectory' in group_names"
    - "'species-list' in group_names"
    - "'logger-service-service' in group_names"
    - "'alerts-service' in group_names"

- name: "Database volumes: Create PostgreSQL external volume"
  docker_volume:
    name: la_postgres-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  tags:
    - db-init
    - docker-volumes
  run_once: true
  when:
    - "'spatial' in group_names"
    - "'image-services' in group_names"
    - "'doi-service' in group_names"
    - "'data_quality_filter_service' in group_names"

- name: "Database volumes: Create MongoDB external volume"
  docker_volume:
    name: la_mongodb-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  tags:
    - db-init
    - docker-volumes
  run_once: true
  when:
    - "'cas-servers' in group_names"
    # WARN: ecodata use host group all
    - "'ecodata' in group_names"
    
- name: "Database volumes: Create Gatus external volume"
  docker_volume:
    name: la_gatus-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  tags:
    - db-init
    - docker-volumes
  when:
    - "'gatus' in group_names"
  run_once: true

- name: "Database volumes: Create Solr external volume"
  docker_volume:
    name: la_solr-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  tags:
    - db-init
    - docker-volumes
  when:
    - "'solrcloud' in group_names"
    - "'solr' in group_names"      
  run_once: true

- name: "Database volumes: Create Cassandra external volume"
  docker_volume:
    name: la_cassandra-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  tags:
    - db-init
    - docker-volumes
  when:
    - "'cassandra5' in group_names"
  run_once: true

- name: "Database volumes: Create Elasticsearch external volume"
  docker_volume:
    name: la_elasticsearch-data
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  tags:
    - db-init
    - docker-volumes
  when:
    - "'image-services' in group_names"
    - "'events' in group_names"
    - "'doi-service' in group_names"
    - "'ecodata' in group_names"
  run_once: true

- name: "Database volumes: Create SSL certificates external volume"
  docker_volume:
    name: la-site-certs
    driver: local
    docker_host: "{{ docker_socket }}"
    state: present
  when: use_la_site_certs | default(false)
  tags:
    - db-init
    - docker-volumes
  run_once: true
