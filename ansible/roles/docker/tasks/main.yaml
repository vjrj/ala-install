---
- name: Add Docker GPG apt Key
  get_url:
    # We use this key from the above repo temporally
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/trusted.gpg.d/dowload.docker.com.asc
    mode: 0644
  when:
    - ansible_os_family == "Debian"
  tags:
    - packages
    - apt

- name: Add Docker Repository
  apt_repository:
    repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  tags:
    - packages
    - apt
    - docker
    - docker-install

- name: Update apt and install docker-ce and related
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
      - containerd.io
    update_cache: true
    state: latest
    autoclean: true
  tags:
    - packages
    - apt
    - docker
    - docker-install

- name: Create containerd data directory
  file:
    path: "{{ containerd_dir }}"
    state: directory
    mode: '0711'
  when: containerd_dir != '/var/lib/containerd'
  tags:
    - docker
    - containerd

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
  when: containerd_dir != '/var/lib/containerd'
  tags:
    - docker
    - containerd

- name: Setup containerd config
  template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
  when: containerd_dir != '/var/lib/containerd'
  register: containerd_config
  tags:
    - docker
    - containerd

- name: Restart containerd
  service:
    name: containerd
    state: restarted
  when: containerd_dir != '/var/lib/containerd' and containerd_config.changed
  tags:
    - docker
    - containerd

- name: Setup docker daemon
  template: src={{ item }} dest=/etc/docker/{{ item }}
  with_items:
    - daemon.json
  register: docker_config
  tags:
    - packages
    - apt
    - docker
    - docker-install

- name: Restart docker
  service:
    name: docker
    state: restarted
  when: docker_config.changed
  tags:
    - docker
    - docker-restart
    - docker-install
