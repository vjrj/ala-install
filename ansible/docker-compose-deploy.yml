---
# Docker Compose Deployment Playbook
# POC for Living Atlas Container Migration

- name: Generate Docker Compose configuration
  hosts: docker_compose
  connection: local
  become: false
  vars:
    # User for docker operations (uses current user or 'ubuntu' for VM)
    docker_default_user: "{{ docker_user | default(ansible_user_id) }}"

    # Skip handlers as we're generating docker-compose files, not deploying to VMs
    skip_handlers: true
    # Note: services_enabled is determined by docker-common role based on inventory variables
    # (not hardcoded here - allow generate-compose.yml to build it from use_* variables)
    # i18n configuration
    i18n:
      enabled: true
      strategy: volume
      volume:
        name: ala-i18n-data
        source: init-container
    # Docker Compose deployment type
    deployment_type: container

    # ======================================
    # Docker Compose Container Names
    # ======================================
    # MySQL and MongoDB container names (used by all services)
    cas_db_hostname: mysql
    collectory_db_host_address: mysql
    collectory_db_host: mysql
    user_store_db_hostname: mysql
    apikey_db_hostname: mysql
    specieslist_db_hostname: mysql

    # MongoDB container names for CAS
    ticket_registry_db_hostname: mongodb
    cas_audit_host: mongodb
    cas_spring_session_host: mongodb
    cas_tickets_host: mongodb
    cas_services_host: mongodb

    # Docker users
    tomcat_user: "{{ docker_default_user }}"
    nginx_user: "{{ docker_default_user }}"
    cas_user: "{{ docker_default_user }}"
    collectory_user: "{{ docker_default_user }}"
    userdetails_user: "{{ docker_default_user }}"
    apikey_user: "{{ docker_default_user }}"
    species_list_user: "{{ docker_default_user }}"

    # Docker-specific nginx configuration directory
    nginx_conf_dir: "{{ data_dir }}/nginx"

    # ======================================
    # Species List specific configuration
    # ======================================
    set_sql_mode: true

    # ======================================
    # Docker Service Internal Ports
    # ======================================
    # All Java services in Docker listen on 8080 internally
    # (not 9000, 9001, etc. like in VM deployments)
    cas_port: 9000
    cas_management_port: 8070
    userdetails_port: 9001
    apikey_port: 9002
    collectory_port: 8080
    bie_hub_port: 8080
    bie_index_port: 8080
    biocache_hub_port: 8080
    biocache_service_port: 8080
    image_service_port: 8080
    logger_service_port: 8080
    namematching_service_port: 8080
    doi_service_port: 8080
    sensitive_data_service_port: 8080
    species_list_port: 8080

    # ======================================
    # Docker Container Hostnames for Nginx
    # Docker Container Hostnames for Nginx
    # These are the service names in docker-compose.yml for nginx proxy_pass
    cas_docker_host: la_cas
    userdetails_docker_host: la_userdetails
    cas_management_docker_host: la_cas-management
    apikey_docker_host: la_apikey
    collectory_docker_host: la_collectory
    bie_hub_docker_host: la_bie_hub
    bie_index_docker_host: la_bie_index
    biocache_hub_docker_host: la_biocache_hub
    biocache_service_docker_host: la_biocache_service
    image_service_docker_host: la_image_service
    logger_service_docker_host: la_logger_service
    namematching_service_docker_host: la_namematching_service
    doi_service_docker_host: la_doi_service
    sensitive_data_service_docker_host: la_sensitive_data_service
    species_list_docker_host: la_species_list

  tasks:
    - name: Load variables from collectory group
      include_vars:
        file: "{{ playbook_dir }}/roles/collectory/vars/main.yml"
      when: "'collectory' in groups"
      tags:
        - always
        - only

    - name: Load variables from cas group
      include_vars:
        file: "{{ playbook_dir }}/roles/cas5/vars/main.yml"
      when: "'cas-servers' in groups"
      tags:
        - always
        - only

    - name: Calculate collectory_app based on version
      set_fact:
        collectory_app: "{{ 'collectory' if collectory_version is version('3', '>=') else 'ala-collectory' }}"
      when: "'collectory' in groups and collectory_version is defined"
      tags:
        - always
        - only

    - name: Include docker-common role to generate docker-compose
      include_role:
        name: docker-common
        tasks_from: generate-compose
      when: deployment_type == 'container'
      tags:
        - always
        - only

    - name: Initialize CAS5 and related databases in Docker Compose containers
      include_role:
        name: docker-common
        tasks_from: generate-db-init-scripts
      vars:
        data_dir: "{{ data_dir }}"
      when:
        - deployment_type == 'container'
        - db_init_enabled | default(true) | bool
      tags:
        - db-init
        - cas-dbs

