---
- hosts: species-list
  vars:
    nginx_conf_dir: "{{ data_dir }}/nginx"
    specieslist_db_hostname: la_mysql
    skip_handlers: true
    tomcat_user: "{{ docker_default_user }}"
    nginx_user: "{{ docker_default_user }}"
    species_list_docker_host: la_species-list
    set_sql_mode: true
  roles:
    - common
    - species-list
  become: true
